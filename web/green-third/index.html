<style>
.l-hero .l-hero__image.hero-slide{opacity:0;transition:opacity 1.6s ease;object-position:78% 40%}
.l-hero .l-hero__image.hero-slide.is-active{opacity:1}
@media (prefers-reduced-motion: reduce){.l-hero .l-hero__image.hero-slide{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  var slides=['./t/hero-jean-phil-v2.jpg','./t/cool-bench.jpg','./t/cool-front-step.jpg','./t/hero-original-character.jpg','./t/pose-jetty.jpg'];
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var started=false;
  function setup(){
    if(started)return true;
    var first=document.querySelector('.t-hero-photo');
    if(!first)return false;
    started=true;
    var box=first.parentNode;
    first.setAttribute('src',slides[0]);
    first.classList.add('hero-slide','is-active');
    var imgs=[first];
    for(var i=1;i<slides.length;i++){
      var im=document.createElement('img');
      im.className='l-hero__image hero-slide';
      im.alt='';im.decoding='async';
      if(!reduce)im.src=slides[i];
      box.appendChild(im);imgs.push(im);
    }
    if(reduce)return true;
    var cur=0;
    setInterval(function(){
      if(document.hidden)return;
      var next=(cur+1)%imgs.length;
      if(!imgs[next].complete)return;
      imgs[cur].classList.remove('is-active');imgs[next].classList.add('is-active');cur=next;
    },6000);
    return true;
  }
  if(!setup()){
    var mo=new MutationObserver(function(){if(setup())mo.disconnect();});
    mo.observe(document.getElementById('root'),{childList:true,subtree:true});
  }
})();
</script>
</body>
</html>
