name: Marketing website
on:
  pull_request:
    paths: ['web/**', 'packages/core/src/stories/**', 'packages/core/assets/stories/**', '.github/workflows/marketing-website.yml']
  push:
    branches: [main]
    paths: ['web/**', 'packages/core/src/stories/**', 'packages/core/assets/stories/**', '.github/workflows/marketing-website.yml']
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --no-package-lock
        working-directory: web
      - run: npm run build:website && npm run check:website
        working-directory: web
