<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Centre Studies — Compare</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f5f1ea;
      color: #171b24;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1f2330;
      color: #f5f1ea;
      padding: 24px 32px;
      border-bottom: 1px solid #2d6a4f;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: rgba(245, 241, 234, 0.7);
    }

    .compare-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      min-height: 0;
    }

    .study-column {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2d6a4f;
      background: #f5f1ea;
    }

    .study-column:last-child {
      border-right: none;
    }

    .study-label {
      background: #1f2330;
      color: #f5f1ea;
      padding: 16px 24px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      border-bottom: 1px solid #2d6a4f;
    }

    .study-frame {
      flex: 1;
      border: none;
      width: 100%;
      min-height: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Command Centre Studies</h1>
    <p class="subtitle">Studies of the live empty shell</p>
  </header>

  <div class="compare-container">
    <div class="study-column">
      <div class="study-label">Quiet</div>
      <iframe src="../grok-tighten/index.html" class="study-frame"></iframe>
    </div>

    <div class="study-column">
      <div class="study-label">Voice</div>
      <iframe src="../claude-editorial/index.html" class="study-frame"></iframe>
    </div>

    <div class="study-column">
      <div class="study-label">Priority</div>
      <iframe src="../gpt-product/index.html" class="study-frame"></iframe>
    </div>
  </div>
</body>
</html>
