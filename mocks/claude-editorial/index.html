<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Centre — Commune</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f1ea;
      color: #171b24;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 230px;
      background: #1f2330;
      color: rgba(255, 255, 255, 0.92);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      left: 0;
      top: 0;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .sidebar-logo-box {
      width: 44px;
      height: 44px;
      background: #667085;
      border-radius: 10px;
    }

    .sidebar-logo-text {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sidebar-nav {
      flex: 1;
    }

    .nav-group {
      margin-bottom: 16px;
    }

    .nav-group-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.5);
      padding: 0 8px;
      margin-bottom: 8px;
    }

    .nav-link {
      display: block;
      padding: 8px 14px;
      color: rgba(255, 255, 255, 0.76);
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 2px;
      transition: background 0.15s, color 0.15s;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .nav-link.active {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .sidebar-footer {
      margin-top: auto;
    }

    .sidebar-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      border-radius: 10px;
      transition: background 0.15s;
    }

    .sidebar-profile:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .profile-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #667085;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 14px;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      color: rgba(255, 255, 255, 0.88);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }

    .profile-plan {
      color: rgba(255, 255, 255, 0.45);
      font-size: 12px;
    }

    /* Main content */
    .main-wrapper {
      margin-left: 230px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 64px;
      background: #f5f1ea;
      border-bottom: 1px solid rgba(23, 27, 36, 0.06);
      display: flex;
      align-items: center;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .search-input {
      flex: 1;
      max-width: 460px;
      height: 36px;
      background: #ffffff;
      border: 1px solid rgba(23, 27, 36, 0.06);
      border-radius: 10px;
      padding: 0 12px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
    }

    .search-input::placeholder {
      color: #667085;
    }

    /* Page content */
    .page-content {
      flex: 1;
      padding: 40px 24px 80px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .page-header {
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(23, 27, 36, 0.06);
    }

    .page-title {
      font-family: 'DM Serif Display', serif;
      font-size: 24px;
      font-weight: 400;
      color: #171b24;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }

    .page-subtitle {
      font-size: 14px;
      color: #667085;
    }

    /* Empty state */
    .empty-card {
      background: #ffffff;
      border: 1px solid rgba(23, 27, 36, 0.06);
      border-radius: 14px;
      padding: 64px 24px;
      text-align: center;
      box-shadow: 0 1px 3px rgba(23, 27, 36, 0.06), 0 1px 2px rgba(23, 27, 36, 0.04);
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      background: rgba(45, 106, 79, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .check-icon {
      width: 24px;
      height: 24px;
      color: #2d6a4f;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 600;
      color: #171b24;
      margin-bottom: 4px;
    }

    .empty-description {
      font-size: 13px;
      color: #667085;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-box"></div>
        <span class="sidebar-logo-text">Commune</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-group">
          <div class="nav-group-label">Menu</div>
          <a href="#" class="nav-link">Overview</a>
        </div>

        <div class="nav-group">
          <div class="nav-group-label">Money</div>
          <a href="#" class="nav-link">Expenses</a>
          <a href="#" class="nav-link">Breakdown</a>
        </div>

        <div class="nav-group">
          <div class="nav-group-label">Insights</div>
          <a href="#" class="nav-link active">Command Centre</a>
          <a href="#" class="nav-link">Analytics</a>
        </div>

        <div class="nav-group">
          <div class="nav-group-label">Team</div>
          <a href="#" class="nav-link">Members</a>
          <a href="#" class="nav-link">Groups</a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-profile">
          <div class="profile-avatar">A</div>
          <div class="profile-info">
            <div class="profile-name">Augustus Edem</div>
            <div class="profile-plan">Pro plan</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <div class="main-wrapper">
      <header class="header">
        <input type="text" class="search-input" placeholder="Search expenses, members...">
      </header>

      <main class="page-content">
        <div class="page-header">
          <h1 class="page-title">Command Centre</h1>
          <p class="page-subtitle">Your priorities across all groups</p>
        </div>

        <!-- Empty state -->
        <div class="empty-card">
          <div class="empty-icon">
            <svg class="check-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
          <h2 class="empty-title">All squared away!</h2>
          <p class="empty-description">You're all caught up. Nothing needs your attention right now.</p>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
