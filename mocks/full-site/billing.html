  <style>
    .plan-card {
      background: rgba(255, 255, 255, 0.82);
      border: 2px solid rgba(45, 106, 79, 0.3);

      padding: 28px;
      max-width: 340px;
      box-shadow: 0 1px 3px rgba(23, 27, 36, 0.06), 0 1px 2px rgba(23, 27, 36, 0.04);
    }

    .plan-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .plan-name {
      font-size: 22px;
      font-weight: 800;
      color: #171b24;
    }

    .active-badge {
      background: rgba(45, 106, 79, 0.12);
      color: #2d6a4f;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">COMMUNE</div>
    
    <div class="nav-label">MENU</div>
    <a href="index.html" class="nav-link">Dashboard</a>
    <a href="groups.html" class="nav-link">My Groups</a>

    <div class="nav-label">MONEY</div>
    <a href="expenses.html" class="nav-link">Expenses</a>
    <a href="recurring.html" class="nav-link">Recurring</a>
    <a href="templates.html" class="nav-link">Templates</a>
    <a href="funds.html" class="nav-link">Funds</a>
    <a href="billing.html" class="nav-link active">Billing</a>

    <div class="nav-label">INSIGHTS</div>

      </div>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <input type="text" class="search" placeholder="Search expenses, members...">
    </div>

    <div class="content">
      <!-- Page header -->
      <div class="page-header">
        <h1 class="page-title">Billing</h1>
        <p class="page-subtitle">Your current plan and subscription</p>

      <!-- Plan card -->
      <div class="plan-card">

          <div>
            <div class="plan-name">Pro</div>
