<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Groups · COMMUNE</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- App Shell -->
  <div class="app-shell">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <div class="commune-wordmark">COMMUNE</div>
      </div>

      <div class="sidebar-search">
        <input type="text" placeholder="Search..." class="search-input">
      </div>

      <div class="nav-section">
        <div class="nav-section-label">Menu</div>
        <a href="./index.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="./groups.html" class="nav-link active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>My Groups</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-label">Insights</div>
        <a href="./overview.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
          <span>Command Centre</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar">AE</div>
          <div class="user-info">
            <div class="user-name">Augustus Edem</div>
            <div class="user-plan">Pro</div>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <header class="page-header-bar">
        <div class="page-header-content">
          <h1 class="page-title">My Groups</h1>
        </div>
      </header>

      <!-- Groups Content -->
      <div class="page-content">
        <!-- Groups Grid -->
        <div class="groups-grid">
          <!-- Household Group -->
          <a href="./group-hub.html" class="group-card">
            <div class="group-card-cover">
              <div class="group-card-cover-gradient" style="background: linear-gradient(135deg, #d7e6dd 0%, #e8f0eb 50%, #f0f7f2 100%);">
                <!-- Decorative icon overlay -->
                <svg viewBox="0 0 24 24" fill="none" stroke="rgba(45,106,79,0.18)" stroke-width="2" style="position: absolute; right: 20px; top: 20px; width: 80px; height: 80px;">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                  <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
              </div>
              <div class="group-card-avatar">
                <svg class="group-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                  <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
              </div>
            </div>
            <div class="group-card-content">
              <div class="group-card-header">
                <div class="group-card-name">Household</div>
                <div class="group-card-tagline">Shared living expenses</div>
              </div>
              <div class="group-card-badges">
                <span class="group-badge group-badge-type">Household</span>
                <span class="group-badge group-badge-status">All settled</span>
              </div>
              <div class="group-card-stats">
                <div class="group-stat">
                  <div class="group-stat-label">Members</div>
                  <div class="group-stat-value">4</div>
                </div>
                <div class="group-stat">
                  <div class="group-stat-label">Monthly</div>
                  <div class="group-stat-value">£1,248</div>
                </div>
                <div class="group-stat">
                  <div class="group-stat-label">Expenses</div>
                  <div class="group-stat-value">12</div>
                </div>
              </div>
            </div>
          </a>

          <!-- Workspace Group -->
          <a href="./group-hub.html" class="group-card">
            <div class="group-card-cover">
              <div class="group-card-cover-gradient" style="background: linear-gradient(135deg, #d0e8f2 0%, #e0f0f7 50%, #eef7fb 100%);">
                <svg viewBox="0 0 24 24" fill="none" stroke="rgba(27,73,101,0.18)" stroke-width="2" style="position: absolute; right: 20px; top: 20px; width: 80px; height: 80px;">
                  <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                  <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
              </div>
              <div class="group-card-avatar">
                <svg class="group-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                  <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
              </div>
            </div>
            <div class="group-card-content">
              <div class="group-card-header">
                <div class="group-card-name">Workspace</div>
                <div class="group-card-tagline">Team operational expenses</div>
              </div>
              <div class="group-card-badges">
                <span class="group-badge group-badge-type">Workspace</span>
                <span class="group-badge" style="background: rgba(231, 111, 81, 0.1); color: var(--commune-peach);">Bills overdue</span>
              </div>
              <div class="group-card-stats">
                <div class="group-stat">
                  <div class="group-stat-label">Members</div>
                  <div class="group-stat-value">8</div>
                </div>
                <div class="group-stat">
                  <div class="group-stat-label">Monthly</div>
                  <div class="group-stat-value">£3,420</div>
                </div>
                <div class="group-stat">
                  <div class="group-stat-label">Expenses</div>
                  <div class="group-stat-value">23</div>
                </div>
              </div>
            </div>
          </a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
