<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Commune</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f1ea;
      color: #171b24;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #171b24;
      text-align: center;
      margin-bottom: 32px;
    }

    .paper {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(23, 27, 36, 0.06);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 12px rgba(23, 27, 36, 0.08);
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      color: #171b24;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #667085;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #171b24;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid rgba(23, 27, 36, 0.1);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      color: #171b24;
      background: #ffffff;
      transition: all 0.15s;
    }

    .form-input:focus {
      outline: none;
      border-color: #2d6a4f;
      box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.1);
    }

    .form-input::placeholder {
      color: #a0a0a0;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: #2d6a4f;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .btn-primary:hover {
      background: #25543f;
    }

    .btn-google {
      background: #ffffff;
      border: 1px solid rgba(23, 27, 36, 0.1);
      color: #171b24;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-google:hover {
      background: #f8f8f8;
      border-color: rgba(23, 27, 36, 0.14);
    }

    .divider-container {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
    }

    .divider {
      flex: 1;
      height: 1px;
      background: rgba(23, 27, 36, 0.08);
    }

    .divider-text {
      font-size: 12px;
      color: #667085;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .footer-text {
      text-align: center;
      font-size: 13px;
      color: #667085;
      margin-top: 20px;
    }

    .link {
      color: #2d6a4f;
      text-decoration: none;
      font-weight: 600;
    }

    .link:hover {
      text-decoration: underline;
    }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 13px;
      color: #2d6a4f;
      text-decoration: none;
      margin-top: 8px;
      margin-bottom: 20px;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">COMMUNE</div>
    
    <div class="paper">
      <h1 class="title">Welcome back</h1>
      <p class="subtitle">Log in to your account to continue</p>

      <form onsubmit="event.preventDefault(); alert('Login submitted');">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="••••••••"
            minlength="8"
            required
          >
        </div>

        <a href="forgot-password.html" class="forgot-link">Forgot password?</a>

        <button type="submit" class="btn btn-primary">Log in</button>
      </form>

      <div class="divider-container">
        <div class="divider"></div>
        <span class="divider-text">or</span>
        <div class="divider"></div>
      </div>

      <button class="btn btn-google" onclick="alert('Google OAuth')">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707 0-.593.102-1.17.282-1.709V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.335z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>

      <p class="footer-text">
        Don't have an account? <a href="onboarding.html" class="link">Sign up</a>
      </p>
    </div>
  </div>
</body>
</html>
