<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit expense · Commune</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f7f3;
            color: #16131d;
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 230px;
            background: rgb(10, 15, 42);
            color: #fff;
            padding: 20px 8px;
            flex-shrink: 0;
        }
        
        .logo-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        
        .logo {
            width: 44px;
            height: 44px;
            background: #2d6a4f;
            border-radius: 10px;
        }
        
        .logo-text {
            font-weight: 600;
            font-size: 18px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            margin-bottom: 2px;
        }
        
        .nav-link.active {
            background: #2d6a4f;
            color: #fff;
        }
        
        .nav-group {
            margin-top: 10px;
        }
        
        .nav-group-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: rgba(255,255,255,0.5);
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            height: 64px;
            background: #fff;
            border-bottom: 1px solid #e5e3dd;
            padding: 0 32px;
        }
        
        .search-input {
            width: 500px;
            padding: 8px 12px;
            border: 1px solid #e5e3dd;
            border-radius: 8px;
            font-size: 14px;
            background: #f8f7f3;
            margin-top: 16px;
        }
        
        .page-container {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }
        
        .page-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .page-subtitle {
            font-size: 15px;
            color: #667085;
            margin-bottom: 24px;
        }
        
        .form-section {
            background: #fff;
            border: 1px solid #e5e3dd;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        
        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e5e3dd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        
        textarea.form-input {
            min-height: 80px;
            resize: vertical;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .button {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            margin-right: 12px;
            text-decoration: none;
            display: inline-block;
        }
        
        .button-primary {
            background: #2d6a4f;
            color: #fff;
        }
        
        .button-default {
            background: #fff;
            color: #16131d;
            border: 1px solid #e5e3dd;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo-row">
            <div class="logo"></div>
            <span class="logo-text">Commune</span>
        </div>
        
        <a href="#" class="nav-link">
            <span>📊</span>
            <span>Dashboard</span>
        </a>
        <a href="#" class="nav-link">
            <span>🏠</span>
            <span>My Groups</span>
        </a>
        
        <div class="nav-group">
            <div class="nav-group-header">
                <span>💰</span>
                <span>Money</span>
            </div>
            <a href="expenses.html" class="nav-link active">
                <span>🧾</span>
                <span>Expenses</span>
            </a>
            <a href="recurring.html" class="nav-link">
                <span>🔁</span>
                <span>Recurring</span>
            </a>
            <a href="templates.html" class="nav-link">
                <span>📋</span>
                <span>Templates</span>
            </a>
            <a href="funds.html" class="nav-link">
                <span>🐷</span>
                <span>Funds</span>
            </a>
            <a href="billing.html" class="nav-link">
                <span>📄</span>
                <span>Billing</span>
            </a>
        </div>
    </div>
    
    <div class="main-content">
        <div class="header">
            <input type="text" class="search-input" placeholder="Search expenses, members...">
        </div>
        
        <div class="page-container">
            <h1 class="page-title">Edit expense</h1>
            <p class="page-subtitle">Update the amount, dates, category, and description</p>
            
            <div class="form-section">
                <div class="form-group">
                    <label class="form-label">Title *</label>
                    <input type="text" class="form-input" value="Electricity bill">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Amount *</label>
                        <input type="number" class="form-input" value="120.00">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Category *</label>
                        <select class="form-input">
                            <option value="utilities" selected>Utilities</option>
                            <option value="groceries">Groceries</option>
                            <option value="rent">Rent</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Due date *</label>
                    <input type="date" class="form-input" value="2024-12-15">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea class="form-input"></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Recurrence</label>
                    <select class="form-input">
                        <option value="none" selected>None</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                    </select>
                </div>
            </div>
            
            <div class="form-section">
                <p style="font-size: 14px; color: #667085;">
                    Split method and participant changes still require a new expense, but vendor and invoice context can be updated here.
                </p>
            </div>
            
            <div>
                <button class="button button-primary">Save changes</button>
                <a href="expenses-detail.html" class="button button-default">Cancel</a>
            </div>
        </div>
    </div>
</body>
</html>
