<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Templates · Commune</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f7f3; color: #16131d; display: flex; min-height: 100vh; }
        .sidebar { width: 230px; background: rgb(10, 15, 42); color: #fff; padding: 20px 8px; flex-shrink: 0; }
        .logo-row { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
        .logo { width: 44px; height: 44px; background: #2d6a4f; border-radius: 10px; }
        .logo-text { font-weight: 600; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: rgba(255,255,255,0.7); text-decoration: none; margin-bottom: 2px; }
        .nav-link.active { background: #2d6a4f; color: #fff; }
        .nav-group { margin-top: 10px; }
        .nav-group-header { display: flex; align-items: center; gap: 6px; padding: 8px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,255,255,0.5); }
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .header { height: 64px; background: #fff; border-bottom: 1px solid #e5e3dd; padding: 0 32px; }
        .search-input { width: 500px; padding: 8px 12px; border: 1px solid #e5e3dd; border-radius: 8px; font-size: 14px; background: #f8f7f3; margin-top: 16px; }
        .page-container { flex: 1; padding: 40px; overflow-y: auto; }
        .page-title { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .page-subtitle { font-size: 15px; color: #667085; margin-bottom: 24px; }
        .button { padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; background: #2d6a4f; color: #fff; display: inline-flex; align-items: center; gap: 8px; }
        .table-container { background: #fff; border: 1px solid #e5e3dd; border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 16px; font-size: 13px; font-weight: 600; color: #667085; border-bottom: 1px solid #e5e3dd; background: #fafaf9; }
        td { padding: 16px; border-bottom: 1px solid #f2f1ed; }
        tr:hover { background: #fafaf9; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; background: #dbeafe; color: #1e40af; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo-row"><div class="logo"></div><span class="logo-text">Commune</span></div>
        <a href="#" class="nav-link"><span>📊</span><span>Dashboard</span></a>
        <a href="#" class="nav-link"><span>🏠</span><span>My Groups</span></a>
        <div class="nav-group">
            <div class="nav-group-header"><span>💰</span><span>Money</span></div>
            <a href="expenses.html" class="nav-link"><span>🧾</span><span>Expenses</span></a>
            <a href="recurring.html" class="nav-link"><span>🔁</span><span>Recurring</span></a>
            <a href="templates.html" class="nav-link active"><span>📋</span><span>Templates</span></a>
            <a href="funds.html" class="nav-link"><span>🐷</span><span>Funds</span></a>
            <a href="billing.html" class="nav-link"><span>📄</span><span>Billing</span></a>
        </div>
    </div>
    <div class="main-content">
        <div class="header"><input type="text" class="search-input" placeholder="Search expenses, members..."></div>
        <div class="page-container">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 32px;">
                <div>
                    <h1 class="page-title">Split Templates</h1>
                    <p class="page-subtitle">Save reusable split configurations to speed up expense creation.</p>
                </div>
                <button class="button">+ New template</button>
            </div>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Split method</th>
                            <th>Participants</th>
                            <th style="width: 60px;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="font-weight: 600;">Rent split</td>
                            <td><span class="badge">Equal</span></td>
                            <td>4 members</td>
                            <td>⋮</td>
                        </tr>
                        <tr>
                            <td style="font-weight: 600;">Groceries 3-way</td>
                            <td><span class="badge">Equal</span></td>
                            <td>3 members</td>
                            <td>⋮</td>
                        </tr>
                        <tr>
                            <td style="font-weight: 600;">Utility bills</td>
                            <td><span class="badge">Percentage</span></td>
                            <td>4 members</td>
                            <td>⋮</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
