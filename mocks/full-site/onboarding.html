<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Started — Commune</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f1ea;
      color: #171b24;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 640px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #171b24;
      text-align: center;
      margin-bottom: 32px;
    }

    .paper {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(23, 27, 36, 0.06);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 12px rgba(23, 27, 36, 0.08);
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      color: #171b24;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #667085;
      margin-bottom: 32px;
    }

    .stepper {
      display: flex;
      justify-content: space-between;
      margin-bottom: 32px;
      position: relative;
    }

    .stepper::before {
      content: '';
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      height: 2px;
      background: rgba(23, 27, 36, 0.08);
      z-index: 0;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(23, 27, 36, 0.08);
      border: 2px solid rgba(23, 27, 36, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #667085;
    }

    .step.active .step-circle {
      background: #2d6a4f;
      border-color: #2d6a4f;
      color: white;
    }

    .step.completed .step-circle {
      background: #2d6a4f;
      border-color: #2d6a4f;
      color: white;
    }

    .step-label {
      font-size: 12px;
      font-weight: 600;
      color: #667085;
    }

    .step.active .step-label {
      color: #2d6a4f;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #171b24;
      margin-bottom: 6px;
    }

    .form-label.required::after {
      content: ' *';
      color: #dc2626;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid rgba(23, 27, 36, 0.1);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      color: #171b24;
      background: #ffffff;
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: #2d6a4f;
    }

    .form-description {
      font-size: 12px;
      color: #667085;
      margin-top: 4px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: #2d6a4f;
      color: #ffffff;
    }

    .btn-primary:hover { background: #25543f; }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(23, 27, 36, 0.1);
      color: #171b24;
    }

    .btn-secondary:hover {
      background: rgba(23, 27, 36, 0.02);
    }

    .button-group {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 32px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">COMMUNE</div>
    
    <div class="paper">
      <h1 class="title">Create your first group</h1>
      <p class="subtitle">Set up a group to start tracking shared expenses</p>

      <!-- Stepper -->
      <div class="stepper">
        <div class="step active">
          <div class="step-circle">1</div>
          <div class="step-label">Details</div>
        </div>
        <div class="step">
          <div class="step-circle">2</div>
          <div class="step-label">Essentials</div>
        </div>
        <div class="step">
          <div class="step-circle">3</div>
          <div class="step-label">Invite</div>
        </div>
      </div>

      <form onsubmit="event.preventDefault(); alert('Group created');">
        <div class="form-group">
          <label class="form-label required" for="name">Group name</label>
          <input 
            type="text" 
            id="name" 
            class="form-input" 
            placeholder="e.g. Flat 12B, Summer Project"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label required" for="type">Type</label>
          <select id="type" class="form-select" required>
            <option value="home">Home</option>
            <option value="couple">Couple</option>
            <option value="workspace">Workspace</option>
            <option value="project">Project</option>
            <option value="trip">Trip</option>
            <option value="other">Other</option>
          </select>
          <div class="form-description">Choose the category that best describes this group</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="description">Description</label>
          <textarea 
            id="description" 
            class="form-textarea" 
            placeholder="Optional details about this group"
          ></textarea>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label class="form-label required" for="currency">Currency</label>
            <select id="currency" class="form-select" required>
              <option value="GBP" selected>GBP — £</option>
              <option value="USD">USD — $</option>
              <option value="EUR">EUR — €</option>
              <option value="NGN">NGN — ₦</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label required" for="cycle">Cycle date</label>
            <select id="cycle" class="form-select" required>
              <option value="1" selected>1st of month</option>
              <option value="15">15th of month</option>
              <option value="last">Last day of month</option>
            </select>
          </div>
        </div>

        <div class="button-group">
          <button type="button" class="btn btn-secondary" onclick="window.location='dashboard.html'">Cancel</button>
          <button type="submit" class="btn btn-primary">Continue</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
