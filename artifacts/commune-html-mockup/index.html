<script type="module">
import {createIcons,House,Receipt,ArrowLeftRight,Repeat,HandCoins,StickyNote,ListChecks,ChevronDown,ChevronRight,Plus,Settings,MapPin,Users,Bell,X,Check,Pin,Menu,Copy,CalendarDays,Wifi,Phone,ArrowLeft} from 'https://cdn.jsdelivr.net/npm/lucide@0.468.0/+esm';
const icons={House,Receipt,ArrowLeftRight,Repeat,HandCoins,StickyNote,ListChecks,ChevronDown,ChevronRight,Plus,Settings,MapPin,Users,Bell,X,Check,Pin,Menu,Copy,CalendarDays,Wifi,Phone,ArrowLeft};
const $=s=>document.querySelector(s),icon=n=>`<i data-lucide="${n}" class="icon"></i>`,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const people=['Maya','Jordan','Alex','Sam'],gbp=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(n/100);
let state={route:'hub',fresh:false,done:false,left:58,nudged:false,received:false,ops:'Week',note:0,expenses:[{title:'The big shop',cents:8452,payer:'Jordan',parts:[2113,2113,2113,2113]}],notes:[{title:'House contacts',body:'The people who help keep things running.',kind:'contacts',pinned:false},{title:'Saturday dinner',body:'Friends are coming over at 7. Bring something to share — we’ll cook together.',pinned:true},{title:'Wi-Fi',body:'Network: MapleHouse\nPassword: together-at-home',pinned:false},{title:'Bins & recycling',body:'Recycling goes out on Thursday evening. Please flatten the cardboard first.',pinned:false},{title:'Spare keys',body:'The spare set is with Jordan. Send a message before collecting it.',pinned:false},{title:'Quiet hours',body:'Let’s keep things quiet after 10pm on weekdays.',pinned:false}],tasks:[]};
let draft=null,detail=0;
const avatar=n=>`<span class="avatar">${esc(n.slice(0,1))}</span>`;
const btn=(text,action,secondary=false)=>`<button class="btn ${secondary?'secondary':''}" data-action="${action}">${text}</button>`;
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function openModal(title,html){$('#modal').innerHTML=`<button class="icon-button close" aria-label="Close" data-action="close">${icon('x')}</button><h2>${title}</h2>${html}`;$('#modal').showModal();paintIcons()}
function paintIcons(){createIcons({icons,attrs:{'stroke-width':1.5}})}
function shell(){const nav=[['home','house','Home'],['hub','house','This Hub'],['break'],['expenses','receipt','Expenses'],['settle','arrow-left-right','Settle'],['recurring','repeat','Recurring'],['funds','hand-coins','Funds'],['notes','sticky-note','Notes'],['operations','list-checks','Operations']];$('#side').innerHTML=`<button class="brand" data-route="hub">commune.</button><nav class="nav" aria-label="Main navigation">${nav.map(([r,i,t])=>r==='break'?'<div class="break"></div>':`<button data-route="${r}" class="${(state.route===r||['add','detail'].includes(state.route)&&r==='expenses')?'active':''}">${icon(i)}${t}</button>`).join('')}</nav><div class="bottom"><button class="switcher" data-action="switch"><span class="house">${icon('house')}</span><span style="flex:1"><b>Maple House</b><small>Household · ${state.fresh?1:4} ${state.fresh?'person':'people'}</small></span>${icon('chevron-down')}</button><button class="account" data-action="account">${avatar('Maya')}<span><b>Maya Ellis</b><small>Admin · ${state.left} reminders left</small></span></button></div>`;
const titles={hub:['This Hub','Friday, 2 October'],home:['Home','Your places, together.'],expenses:['Expenses','Shared costs, clearly divided.'],add:['Add expense','Maple House'],detail:['Expense details','Maple House'],settle:['Settle','Record what’s paid. See what’s left.'],notes:['Notes','The things everyone needs to know.'],operations:['Operations','What’s yours, then the week.'],funds:['Funds','Save towards something together.'],recurring:['Recurring','Shared bills on a schedule.']};let [title,sub]=titles[state.route]||titles.hub;$('#top').innerHTML=`<button class="icon-button mobile-menu" data-action="menu" aria-label="Open navigation">${icon('menu')}</button><div><h1>${title}</h1><small>${sub}</small></div><div class="top-right"><span class="demo">Interactive mockup</span><button class="icon-button" data-action="notifications" aria-label="Notifications">${icon('bell')}</button></div>`;}
function date(day,num,label=''){return `<span class="date"><small>${day}</small><strong>${num}</strong>${label?`<em>${label}</em>`:''}</span>`}
function hub(){let empty=state.fresh;return `<section class="hero"><img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1800&q=85" alt="A bright shared living room with a sofa and large windows"><div class="hero-actions"><button class="glass" data-action="invite">${icon('users')} Invite</button><button class="glass" data-action="house-settings" aria-label="House settings">${icon('settings')}</button></div><div class="hero-copy"><small>Your shared home</small><h2>Maple House</h2><p>${icon('map-pin')} Stoke Newington, London</p><div class="people">${(empty?['Maya']:people).map(avatar).join('')}<span>${empty?'Just you, for now':'Maya, Jordan, Alex & Sam'}</span></div></div></section><div class="two"><section class="panel"><h2>${empty?'You’re all square':'Your balance'}</h2><div class="money">${empty?'£0.00':'£21.13'}</div><p class="muted">${empty?'A fresh start for your shared home.':'You owe Jordan for the big shop.'}</p>${!empty?'<p class="balance-note">Alex also owes you £18.00. Kept separate, so it’s clear.</p>':''}<div class="actions">${btn(icon('plus')+' Add expense','add')} ${empty?'':'<button class="link" data-route="settle">View settlement</button>'}</div></section><section class="panel"><div class="panel-head"><h2>${empty?'Make it your home':'Needs you'}</h2>${!empty?`<small>${state.done?'1 thing':'2 things'}</small>`:''}</div>${empty?`<p class="muted">Bring your people in. They can share costs, pick up jobs and find the details here.</p><div class="actions">${btn('Invite your people','invite')}</div>`:`<div class="row"><span class="chip blue">${icon('receipt')}</span><div class="grow"><b>The big shop</b><small>Your share is ready to settle</small></div><button class="link" data-route="settle">£21.13</button></div><div class="row"><span class="chip">${icon('list-checks')}</span><div class="grow"><b>Kitchen reset</b><small>${state.done?'Done for today':'Your turn today'}</small></div><button class="check ${state.done?'done':''}" data-action="complete" aria-label="${state.done?'Mark kitchen reset incomplete':'Complete kitchen reset'}">${state.done?icon('check'):''}</button></div>`}</section></div><div class="two"><section class="panel"><div class="panel-head"><h2 class="section-title">${icon('calendar-days')} This week</h2><button class="link" data-route="operations">View week</button></div>${empty?`<div class="empty-prompt"><p>Nothing planned yet.</p>${btn('Add the first task','task',true)}</div>`:`<div class="row week-row">${date('FRI',2,'Today')}<div class="grow"><b>Kitchen reset</b><small>Maya · ${state.done?'Completed':'Any time today'}</small></div></div><div class="row week-row">${date('SAT',3,'Tomorrow')}<div class="grow"><b>Dinner at home</b><small>Everyone · 7pm</small></div></div>`}</section><section class="panel"><div class="panel-head"><h2 class="section-title">${icon('sticky-note')} Shared essentials</h2><button class="link" data-route="notes">All notes</button></div>${empty?`<div class="row"><span class="chip">${icon('wifi')}</span><div class="grow"><b>Add your Wi-Fi details</b></div><button class="link" data-action="new-note">Add</button></div><div class="row"><span class="chip">${icon('phone')}</span><div class="grow"><b>Keep useful contacts here</b></div><button class="link" data-action="new-note">Add</button></div>`:`<button class="row list-button" data-note="2"><span class="chip">${icon('wifi')}</span><div class="grow"><b>Wi-Fi</b><small>MapleHouse</small></div>${icon('chevron-right')}</button><button class="row list-button" data-note="0"><span class="chip">${icon('phone')}</span><div class="grow"><b>House contacts</b><small>Plumber, property manager & cleaner</small></div>${icon('chevron-right')}</button><div class="note-strip">${icon('pin')} Saturday dinner at 7. Bring something to share.</div>`}</section></div>${!empty?'<section class="activity"><h3>Recently in your home</h3><p>Jordan added The big shop · Yesterday &nbsp; / &nbsp; Sam updated Wi-Fi · Wednesday</p></section>':''}<div class="prototype-footer">Preview a <button data-action="scenario">${empty?'lived-in home':'brand-new home'}</button> · Sample data only</div>`}
function expenses(){return `<div class="toolbar"><h2>${state.fresh?'Your shared expenses':'October expenses'}</h2>${btn(icon('plus')+' Add expense','add')}</div><section class="panel big-list">${state.fresh?'<div class="empty-prompt"><h2>No expenses yet.</h2><p>Add something you’ve paid for and choose how to split it.</p></div>':state.expenses.map((e,i)=>`<button class="row list-button" data-detail="${i}"><span class="chip blue">${icon('receipt')}</span><div class="grow"><b>${esc(e.title)}</b><small>Paid by ${esc(e.payer)} · ${e.parts.filter(x=>x>0).length} people</small></div><div style="text-align:right"><b>${gbp(e.cents)}</b><small>Your share ${gbp(e.parts[0])}</small></div>${icon('chevron-right')}</button>`).join('')}</section>`}
function newDraft(){draft={title:'',amount:'',payer:'Maya',method:'Equal',selected:[true,true,true,true],values:[1,1,1,1]};state.route='add';render()}
function shares(){let cents=Math.round(Number(draft.amount)*100),ids=draft.selected.map((x,i)=>x?i:-1).filter(i=>i>=0),parts=[0,0,0,0],error='';if(!Number.isFinite(cents)||cents<=0||cents>100000000)error='Enter an amount between £0.01 and £1,000,000.';else if(!ids.length)error='Choose at least one person.';else if(draft.method==='Exact'){ids.forEach(i=>parts[i]=Math.round(Number(draft.values[i])*100));if(parts.reduce((a,b)=>a+b,0)!==cents)error='Exact amounts must add up to the total.'}else{let weights=ids.map(i=>draft.method==='Equal'?1:Number(draft.values[i])),sum=weights.reduce((a,b)=>a+b,0);if(!sum||weights.some(x=>!Number.isFinite(x)||x<0))error='Enter valid positive shares.';else if(draft.method==='Percentage'&&Math.abs(sum-100)>.001)error='Percentages must add up to 100%.';else{let raw=weights.map(w=>cents*w/sum);ids.forEach((id,j)=>parts[id]=Math.floor(raw[j]));let left=cents-parts.reduce((a,b)=>a+b,0);ids.map((id,j)=>({id,frac:raw[j]-Math.floor(raw[j])})).sort((a,b)=>b.frac-a.frac).slice(0,left).forEach(x=>parts[x.id]++)}}if(parts.some(x=>!Number.isFinite(x)||x<0))error='Shares cannot be negative.';return {cents,parts,error}}
function expenseForm(){return `<div class="form-layout"><form id="expense-form" class="panel"><label class="field"><span>What was it for?</span><input name="title" maxlength="80" required placeholder="e.g. The big shop" value="${esc(draft.title)}"></label><div class="two" style="margin-top:0"><label class="field"><span>Total amount · GBP</span><input name="amount" class="amount-input" type="number" step=".01" min=".01" max="1000000" required placeholder="0.00" value="${draft.amount}"></label><label class="field"><span>Paid by</span><select name="payer">${people.map(n=>`<option ${n===draft.payer?'selected':''}>${n}</option>`).join('')}</select></label></div><label class="field"><span>How should we split it?</span></label><div class="tabs" role="group" aria-label="Split method">${['Equal','Exact','Percentage','Shares'].map(m=>`<button type="button" data-method="${m}" class="${draft.method===m?'selected':''}" aria-pressed="${draft.method===m}">${m}</button>`).join('')}</div><div style="margin-top:12px">${people.map((n,i)=>`<div class="split-person"><input type="checkbox" data-person="${i}" ${draft.selected[i]?'checked':''} aria-label="Include ${n}">${avatar(n)}<span class="name">${n}${i===0?' (you)':''}</span>${draft.method!=='Equal'?`<input type="number" min="0" step="${draft.method==='Shares'?'1':'.01'}" data-value="${i}" value="${draft.values[i]}" aria-label="${n} ${draft.method}">${draft.method==='Percentage'?'%':''}`:''}<output id="share-${i}">£0.00</output></div>`).join('')}</div><p class="error" id="split-error" role="status"></p><div class="actions"><button class="btn" type="submit">Save expense</button><button type="button" class="link" data-route="expenses">Cancel</button></div></form><aside class="panel summary"><h2>The split, at a glance</h2><div class="row"><span>Total</span><strong id="sum-total">£0.00</strong></div><div class="row"><span>Your share</span><span id="sum-you">£0.00</span></div><small id="sum-message">Enter an amount to see everyone’s share.</small><div class="divider"></div><small>Commune records who paid and who owes what. It doesn’t move money.</small></aside></div>`}
function updateCalc(){let {cents,parts,error}=shares();people.forEach((_,i)=>$('#share-'+i).textContent=gbp(Number.isFinite(parts[i])?parts[i]:0));$('#sum-total').textContent=gbp(Number.isFinite(cents)?cents:0);$('#sum-you').textContent=gbp(parts[0]||0);$('#split-error').textContent=draft.amount?error:'';$('#sum-message').textContent=error?'Adjust the split before saving.':`Paid by ${draft.payer}. ${draft.method==='Equal'?'Any extra penny is allocated fairly in the listed order.':'Each person can see their exact share.'}`}
function expenseDetail(){let e=state.expenses[detail];return `<div class="toolbar"><button class="link" data-route="expenses">${icon('arrow-left')} All expenses</button><span class="badge">${e.parts[0]&&e.payer!=='Maya'?'Your share is outstanding':'Recorded'}</span></div><section class="panel" style="max-width:760px"><h2>${esc(e.title)}</h2><div class="detail-total">${gbp(e.cents)}</div><p class="muted">Paid by ${esc(e.payer)}</p><div class="divider"></div>${people.map((n,i)=>`<div class="row">${avatar(n)}<div class="grow">${n}${i===0?' (you)':''}</div><span>${gbp(e.parts[i])}</span></div>`).join('')}<div class="actions">${btn('View settlement','settle',true)}</div></section>`}
function settle(){return `<div class="two" style="margin-top:0"><section class="panel"><h2>You owe</h2><div class="money">£21.13</div><div class="row">${avatar('Jordan')}<div class="grow"><b>Jordan</b><small>The big shop</small></div>${btn('Record payment','payment',true)}</div><p class="balance-note">Record a payment after paying Jordan outside Commune.</p></section><section class="panel"><h2>You’re owed</h2><div class="money">${state.received?'£0.00':'£18.00'}</div>${state.received?'<p class="muted">Alex’s payment is recorded.</p>':`<div class="row">${avatar('Alex')}<div class="grow"><b>Alex</b><small>House supplies</small></div><button class="link" data-action="nudge">${state.nudged?'Reminder sent':'Nudge'}</button></div><div class="actions">${btn('Confirm received','received',true)}</div>`}</section></div><div class="prototype-footer">Payment recording and reminders are simulated here. No money or emails are sent.</div>`}
function notes(){return `<div class="toolbar"><input class="search" id="note-search" placeholder="Find a note…" aria-label="Search notes">${btn(icon('plus')+' Add note','new-note')}</div><div class="notes-layout"><div class="board" id="board">${noteCards('')}</div><section class="panel reader">${reader()}</section></div>`}
function noteCards(query){return state.notes.map((n,i)=>({...n,i})).filter(n=>(n.title+' '+n.body).toLowerCase().includes(query.toLowerCase())).map(n=>`<button class="note-card ${n.pinned?'pinned':''} ${n.i===state.note?'selected':''}" data-note="${n.i}"><h3 class="section-title">${icon(n.kind==='contacts'?'phone':n.pinned?'pin':'sticky-note')}${esc(n.title)}</h3><p>${esc(n.body.slice(0,90))}</p><small>${n.pinned?'Pinned · ':''}Shared with your home</small></button>`).join('')||'<p class="muted">No notes match that search.</p>'}
function reader(){let n=state.notes[state.note];return `<div class="panel-head"><h2>${esc(n.title)}</h2><button class="icon-button" data-action="pin-note" aria-label="${n.pinned?'Unpin':'Pin'} note">${icon('pin')}</button></div>${n.kind==='contacts'?['Pat Morgan|Plumber|020 7946 0102','Jamie Lee|Property manager|020 7946 0103','Cleo James|Cleaner|020 7946 0104'].map(s=>{let [name,role,phone]=s.split('|');return `<div class="row"><div class="grow"><b>${name}</b><small>${role}</small><small>${phone}</small></div>${icon('phone')}</div>`}).join(''):`<p>${esc(n.body)}</p>`}<div class="actions">${btn(n.kind==='contacts'?'Add a contact':'Edit note',n.kind==='contacts'?'contact':'edit-note',true)}</div>`}
function operations(){return `<div class="toolbar"><div class="tabs">${['Week','People','Month'].map(t=>`<button data-ops="${t}" class="${state.ops===t?'selected':''}">${t}</button>`).join('')}</div>${btn(icon('plus')+' Add item','task')}</div><section class="panel" style="margin-bottom:22px"><small>Yours today</small><h2 style="margin-top:5px">${state.done?'You’re clear today.':'A quick kitchen reset.'}</h2><p class="muted" style="margin-top:7px">${state.done?'Nothing else needs your attention.':'Wipe the surfaces, empty the dishwasher, make room for the weekend.'}</p></section><section class="panel"><div class="panel-head"><h2>${state.ops==='Week'?'28 September – 4 October':state.ops==='Month'?'October 2026':'Who’s doing what'}</h2></div>${state.ops==='Month'?`<div class="calendar">${Array.from({length:31},(_,i)=>`<div class="${i===1?'today':''}">${i+1}${i===1?'<small style="display:block">Kitchen</small>':''}</div>`).join('')}</div><small>Calendar layout preview; item editing is available in Week.</small>`:state.ops==='People'?people.map((p,i)=>`<div class="row">${avatar(p)}<div class="grow"><b>${p}</b><small>${i===0?(state.done?'Kitchen reset completed':'Kitchen reset today'):'Nothing assigned today'}</small></div></div>`).join(''):`<div class="row"><div class="ops-date">${date('FRI',2,'Today')}</div><div class="grow"><b>Kitchen reset</b><small>Maya · Any time</small></div><button class="check ${state.done?'done':''}" data-action="complete" aria-label="Toggle kitchen reset">${state.done?icon('check'):''}</button></div><div class="row"><div class="ops-date">${date('SAT',3,'Tomorrow')}</div><div class="grow"><b>Dinner at home</b><small>Everyone · 7pm</small></div></div>${state.tasks.map(t=>`<div class="row"><div class="ops-date">${date('FRI',2,'Today')}</div><div class="grow"><b>${esc(t)}</b><small>Maya · Any time</small></div></div>`).join('')}`}</section>`}
function render(){shell();let pages={hub,home:hub,expenses,add:expenseForm,detail:expenseDetail,settle,notes,operations};$('#app').innerHTML=pages[state.route]?pages[state.route]():`<section class="panel empty-prompt"><h2>${state.route==='funds'?'A shared goal, without the guesswork.':'A place for your regular bills.'}</h2><p>This screen is outside this focused Hub mockup. No feature has been enabled or changed in the app.</p><button class="btn secondary" data-route="hub">Back to the Hub</button></section>`;paintIcons();if(state.route==='add')updateCalc()}
function route(r){if(r==='add')return newDraft();state.route=r;$('#side').classList.remove('open');render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.route)return route(b.dataset.route);if(b.dataset.detail!==undefined){detail=+b.dataset.detail;return route('detail')}if(b.dataset.note!==undefined){state.note=+b.dataset.note;return route('notes')}if(b.dataset.ops){state.ops=b.dataset.ops;return render()}if(b.dataset.method){draft.method=b.dataset.method;draft.values=people.map(()=>draft.method==='Percentage'?25:draft.method==='Exact'?Number(draft.amount)/4:1);return render()}switch(b.dataset.action){case 'close':$('#modal').close();break;case 'menu':$('#side').classList.toggle('open');break;case 'add':newDraft();break;case 'settle':route('settle');break;case 'scenario':state.fresh=!state.fresh;render();break;case 'complete':state.done=!state.done;render();toast(state.done?'Kitchen reset completed in this mockup.':'Kitchen reset reopened.');break;case 'switch':openModal('Your communes',`<button class="switcher" style="color:var(--ink);background:var(--tint)" data-action="close"><span class="house">${icon('house')}</span><span>Maple House</span></button><p class="muted" style="margin-top:20px">The original compact switcher stays here. You’re viewing a sample household.</p>`);break;case 'account':openModal('Maya Ellis',`<p class="muted">Admin</p><div class="money">${state.left}<small> / 60 left</small></div><p>Reminder allowance in the last 30 days.</p><div class="divider"></div><small>Sample account only. Nothing here changes your real profile.</small>`);break;case 'notifications':openModal('Notifications','<p>Jordan added The big shop.</p><p class="muted" style="margin-top:8px">Your share is £21.13.</p>');break;case 'house-settings':openModal('Maple House',`<label class="field"><span>House name</span><input value="Maple House" readonly></label><label class="field"><span>Location</span><input value="Stoke Newington, London" readonly></label><small>Location and photo editing stay in commune settings. This mockup preserves your house photo in the Hub.</small>`);break;case 'invite':openModal('Invite someone home',`<form id="invite-form"><label class="field"><span>Email address</span><input type="email" name="email" required placeholder="name@example.com"></label><label class="field"><span>Role</span><select><option>Member</option><option>Admin</option></select></label><button class="btn">Preview invitation</button><p class="muted" style="margin-top:14px;font-size:12px">Demo only — no invitation will be emailed.</p></form>`);break;case 'payment':openModal('Record payment to Jordan','<p>This preview doesn’t move money or change your real balance.</p><div class="actions"><button class="btn" data-action="record-payment">Preview payment record</button></div>');break;case 'record-payment':$('#modal').close();toast('Payment record previewed. No money moved.');break;case 'received':state.received=true;render();toast('Alex’s £18 payment recorded in the mockup.');break;case 'nudge':if(state.nudged){toast('A reminder has already been previewed for Alex.');break}openModal('A gentle nudge for Alex',`<p>Hi Alex, a quick reminder about your £18.00 share of House supplies in Maple House.</p><div class="divider"></div><small>${state.left} reminders remaining. A cooldown prevents repeated reminders.</small><div class="actions"><button class="btn" data-action="send-nudge">Preview sending</button></div><small style="display:block;margin-top:14px">No email will be sent from this mockup.</small>`);break;case 'send-nudge':state.nudged=true;state.left--;$('#modal').close();render();toast('Reminder previewed. No email sent.');break;case 'pin-note':state.notes[state.note].pinned=!state.notes[state.note].pinned;render();break;case 'new-note':case 'edit-note':{let edit=b.dataset.action==='edit-note',n=edit?state.notes[state.note]:{title:'',body:''};openModal(edit?'Edit note':'Add a note',`<form id="note-form" data-edit="${edit}"><label class="field"><span>Title</span><input name="title" maxlength="80" value="${esc(n.title)}" required></label><label class="field"><span>Note</span><textarea name="body" maxlength="1500" required>${esc(n.body)}</textarea></label><button class="btn">Save note</button></form>`);break}case 'contact':openModal('Add a house contact',`<form id="contact-form"><label class="field"><span>Name</span><input name="name" maxlength="80" required></label><label class="field"><span>Role or service</span><input name="role" maxlength="60" placeholder="e.g. Electrician, neighbour, landlord" required></label><label class="field"><span>Contact details</span><input name="contact" maxlength="120" required></label><button class="btn">Save contact</button></form>`);break;case 'task':openModal('Add an item',`<form id="task-form"><label class="field"><span>What needs doing?</span><input name="title" maxlength="80" required></label><p class="muted">Assigned to you, today, for this preview.</p><div class="actions"><button class="btn">Add item</button></div></form>`);break;}});
document.addEventListener('input',e=>{if(e.target.id==='note-search'){ $('#board').innerHTML=noteCards(e.target.value);paintIcons();return}if(!e.target.closest('#expense-form'))return;let t=e.target;if(t.name)draft[t.name]=t.value;if(t.dataset.person!==undefined)draft.selected[+t.dataset.person]=t.checked;if(t.dataset.value!==undefined)draft.values[+t.dataset.value]=t.value;updateCalc()});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f);if(f.id==='expense-form'){let {cents,parts,error}=shares();if(error)return $('#split-error').textContent=error;if(!draft.title.trim())return;state.expenses.push({title:draft.title.trim(),cents,payer:draft.payer,parts});detail=state.expenses.length-1;state.fresh=false;route('detail');toast('Expense saved in this mockup only.');return}if(f.id==='note-form'){let n={title:String(d.get('title')).trim(),body:String(d.get('body')).trim(),pinned:false};if(!n.title||!n.body)return;if(f.dataset.edit==='true')state.notes[state.note]={...state.notes[state.note],...n};else{state.notes.push(n);state.note=state.notes.length-1}$('#modal').close();route('notes');toast('Note saved in the mockup.');return}if(f.id==='contact-form'){state.notes.push({title:String(d.get('name')),body:String(d.get('role'))+'\n'+String(d.get('contact')),pinned:false});state.note=state.notes.length-1;$('#modal').close();route('notes');toast('Contact saved as a shared note in the mockup.');return}if(f.id==='task-form'){state.tasks.push(String(d.get('title')).trim());$('#modal').close();state.ops='Week';route('operations');return}if(f.id==='invite-form'){$('#modal').close();toast('Invitation preview ready for '+d.get('email')+'. No email sent.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#side').classList.remove('open')});render();
</script></body></html>
